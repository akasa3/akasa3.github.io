
---
layout: default
title: Home
---

<h2>Posts</h2>
<ul>
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <span>{{ post.date | date: "%Y-%m-%d" }}</span>
      <div>
        {% for tag in post.tags %}
          <a href="/tags/{{ tag }}.html">#{{ tag }}</a>
        {% endfor %}
      </div>
    </li>
  {% endfor %}
</ul>
